openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: financial-shield
    description: Demo account and simulated purchases for the Financial Safety Shield MVP
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [financial-shield]
      summary: Get the demo dashboard
      description: Returns a demo account, virtual card, and recent simulated purchase attempts
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "503":
          description: MongoDB is not configured or is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /protection-settings:
    get:
      operationId: getProtectionSettings
      tags: [financial-shield]
      summary: Read the shared demo account protection settings
      responses:
        "200":
          description: Saved settings or initial defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectionSettings"
        "503":
          description: Settings storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateProtectionSettings
      tags: [financial-shield]
      summary: Save all protection settings for the shared demo account
      description: Configures the shield only; does not execute payments or enforce purchase cooldowns.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProtectionSettings"
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectionSettings"
        "400":
          description: Invalid settings, including identical start and end hours
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Settings storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /purchases/simulate:
    post:
      operationId: createPurchaseSimulation
      tags: [financial-shield]
      summary: Record a simulated purchase attempt
      description: Saves a purchase simulation without charging money or contacting a bank
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseSimulationInput"
      responses:
        "201":
          description: Purchase simulation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseSimulation"
        "400":
          description: Invalid purchase simulation input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: MongoDB is not configured or is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    ProtectionSettings:
      type: object
      additionalProperties: false
      description: Daily local-clock hours, start inclusive and end exclusive. Start greater than end means overnight. Start and end must differ. Shared demo settings, not per-user.
      required: [enabled, blockStartHour, blockEndHour, cooldownMinutes]
      properties:
        enabled:
          type: boolean
          default: false
        blockStartHour:
          type: integer
          minimum: 0
          maximum: 23
          default: 22
        blockEndHour:
          type: integer
          minimum: 0
          maximum: 23
          default: 7
        cooldownMinutes:
          type: integer
          minimum: 1
          maximum: 120
          default: 10
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DemoAccount:
      type: object
      properties:
        displayName:
          type: string
        availableBalance:
          type: number
        currency:
          type: string
      required: [displayName, availableBalance, currency]
    DemoVirtualCard:
      type: object
      properties:
        holderName:
          type: string
        lastFour:
          type: string
        status:
          type: string
      required: [holderName, lastFour, status]
    PurchaseSimulation:
      type: object
      properties:
        id:
          type: string
        merchantName:
          type: string
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [simulated]
        createdAt:
          type: string
          format: date-time
      required: [id, merchantName, amount, currency, status, createdAt]
    Dashboard:
      type: object
      properties:
        account:
          $ref: "#/components/schemas/DemoAccount"
        virtualCard:
          $ref: "#/components/schemas/DemoVirtualCard"
        protectionEnabled:
          type: boolean
        recentSimulations:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseSimulation"
      required: [account, virtualCard, protectionEnabled, recentSimulations]
    PurchaseSimulationInput:
      type: object
      properties:
        merchantName:
          type: string
          minLength: 1
          maxLength: 80
        amount:
          type: number
          exclusiveMinimum: 0
          maximum: 10000
        currency:
          type: string
          enum: [KWD]
      required: [merchantName, amount, currency]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

