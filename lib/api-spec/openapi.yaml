openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: financial-shield
    description: Demo account and simulated purchases for the Financial Safety Shield MVP
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [financial-shield]
      summary: Get the demo dashboard
      description: Returns a demo account, virtual card, and recent simulated purchase attempts
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "503":
          description: MongoDB is not configured or is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /protection-settings:
    get:
      operationId: getProtectionSettings
      tags: [financial-shield]
      summary: Read the shared demo account protection settings
      responses:
        "200":
          description: Saved settings or initial defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectionSettings"
        "503":
          description: Settings storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateProtectionSettings
      tags: [financial-shield]
      summary: Save all protection settings for the shared demo account
      description: Configures protection for new simulated attempts. Existing cooldown deadlines remain unchanged. No real payments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProtectionSettings"
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectionSettings"
        "400":
          description: Invalid settings, including identical start and end hours
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Settings storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /purchases/simulate:
    post:
      operationId: createPurchaseSimulation
      tags: [financial-shield]
      summary: Record a simulated purchase attempt
      description: Saves a demo simulation without payments. Reuse idempotencyKey with identical input after a lost response to recover the same attempt and original deadline. A deliberate new attempt requires a new key; changed input with an existing key returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseSimulationInput"
      responses:
        "200":
          description: Existing attempt recovered; status and original cooldown deadline are preserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseSimulation"
        "201":
          description: Purchase simulation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseSimulation"
        "400":
          description: Invalid purchase simulation input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Idempotency key already used with different purchase input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: MongoDB is not configured or is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /purchases/{id}:
    get:
      operationId: getPurchaseSimulation
      tags: [financial-shield]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[a-fA-F0-9]{24}$" } }
      responses:
        "200":
          description: Saved attempt with current server time
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseSimulation" }
        "404":
          description: Attempt not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /purchases/{id}/decision:
    post:
      operationId: decidePurchaseSimulation
      tags: [financial-shield]
      description: Postpone at any time, or continue only after the saved cooldown and both awareness answers. A terminal decision cannot be changed. No real charge.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[a-fA-F0-9]{24}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseDecisionInput" }
      responses:
        "200":
          description: Saved final decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseSimulation" }
        "400":
          description: Invalid decision or missing answers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Attempt not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: Cooldown has not ended or attempt already finalized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
components:
  schemas:
    ProtectionSettings:
      type: object
      additionalProperties: false
      description: Daily local-clock hours, start inclusive and end exclusive. Start greater than end means overnight. Start and end must differ. Shared demo settings, not per-user.
      required: [enabled, blockStartHour, blockEndHour, cooldownMinutes]
      properties:
        enabled:
          type: boolean
          default: false
        blockStartHour:
          type: integer
          minimum: 0
          maximum: 23
          default: 22
        blockEndHour:
          type: integer
          minimum: 0
          maximum: 23
          default: 7
        cooldownMinutes:
          type: integer
          minimum: 1
          maximum: 120
          default: 10
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DemoAccount:
      type: object
      properties:
        displayName:
          type: string
        availableBalance:
          type: number
        currency:
          type: string
      required: [displayName, availableBalance, currency]
    DemoVirtualCard:
      type: object
      properties:
        holderName:
          type: string
        lastFour:
          type: string
        status:
          type: string
      required: [holderName, lastFour, status]
    PurchaseSimulation:
      type: object
      properties:
        id:
          type: string
        merchantName:
          type: string
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [simulated, cooling_down, postponed]
        cooldownEndsAt:
          type: [string, "null"]
          format: date-time
        serverTime:
          type: string
          format: date-time
        decidedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, merchantName, amount, currency, status, createdAt, cooldownEndsAt, serverTime, decidedAt]
    Dashboard:
      type: object
      properties:
        account:
          $ref: "#/components/schemas/DemoAccount"
        virtualCard:
          $ref: "#/components/schemas/DemoVirtualCard"
        protectionEnabled:
          type: boolean
        recentSimulations:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseSimulation"
        pendingSimulations:
          description: All unresolved cooling attempts, including those older than the recent history window
          type: array
          items:
            $ref: "#/components/schemas/PurchaseSimulation"
      required: [account, virtualCard, protectionEnabled, recentSimulations, pendingSimulations]
    PurchaseSimulationInput:
      type: object
      properties:
        idempotencyKey:
          description: Client-generated UUID retained for retries of this exact attempt; use a fresh UUID for an intentional new attempt
          type: string
          format: uuid
        merchantName:
          type: string
          minLength: 1
          maxLength: 80
        amount:
          type: number
          exclusiveMinimum: 0
          maximum: 10000
        currency:
          type: string
          enum: [KWD]
        timeZone:
          description: Device IANA timezone; server evaluates the current local hour using its own clock
          type: string
          minLength: 1
          maxLength: 100
      required: [idempotencyKey, merchantName, amount, currency, timeZone]
    PurchaseDecisionInput:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [continue, postpone]
        isNecessary:
          type: boolean
          description: Answer to whether this purchase is a current need; either answer is accepted
        fitsBudget:
          type: boolean
          description: Answer to whether this purchase fits the planned budget; either answer is accepted
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

