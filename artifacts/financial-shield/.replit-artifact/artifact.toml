kind = "web"
previewPath = "/"
title = "درع الأمان المالي"
description = "A prototype Arabic RTL neobank safety app for young employees, with a demo account and virtual card plus persisted simulated purchase attempts."
version = "1.0.0"
id = "artifacts/financial-shield"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21276

[services.development]
run = "pnpm --filter @workspace/financial-shield run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/financial-shield", "run", "build" ]
serve = "static"
publicDir = "artifacts/financial-shield/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21276"
BASE_PATH = "/"
